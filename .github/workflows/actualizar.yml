name: Actualizar precios

on:
  schedule:
    - cron: "17 8 * * *"   # todos los dias, ~05:17 hora de Chile
  workflow_dispatch:        # tambien se puede lanzar a mano

permissions:
  contents: write

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar precios
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python actualizar_precios.py
      - name: Guardar cambios
        run: |
          git config user.name "precios-bot"
          git config user.email "precios-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Precios del $(date +%F)"
          git push
